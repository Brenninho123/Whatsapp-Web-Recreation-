<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>WhatsApp Simulação</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg-dark:#0b141a;
  --panel-dark:#202c33;
  --in-dark:#1f2c33;
  --out-dark:#005c4b;
  --text-dark:#ffffff;
  --muted-dark:#8696a0;

  --bg-light:#f0f0f0;
  --panel-light:#e5e5e5;
  --in-light:#d4f1ff;
  --out-light:#b2e0a6;
  --text-light:#111111;
  --muted-light:#555555;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;}
body{overflow:hidden; transition:background 0.3s,color 0.3s}

/* STATUS BAR */
#statusbar{
  height:24px; display:flex; justify-content:space-between; align-items:center;
  padding:0 8px; font-size:12px; background:var(--panel-dark); color:var(--text-dark);
}

/* LOCK SCREEN */
#lock{
  position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center;
  background:linear-gradient(#000,var(--bg-dark)); text-align:center; z-index:10;
}
#lock h1{color:var(--out-dark); margin-bottom:6px;}
#lock p{color:var(--muted-dark); font-size:14px;}
#count{font-size:28px; color:#ff4d4d; margin:14px;}
#lock input{width:220px; padding:12px; border-radius:999px; border:none; text-align:center;}
#lock button{margin-top:14px; padding:12px 28px; border-radius:999px; border:none; background:var(--out-dark); color:#000; font-weight:600; cursor:pointer;}

/* APP */
#app{display:none; height:calc(100% - 24px); background:var(--bg-dark); flex-direction:column;}
.topbar{background:var(--panel-dark); display:flex; align-items:center; gap:10px; padding:10px 12px;}
.avatar{width:36px; height:36px; border-radius:50%; background:var(--out-dark); display:grid; place-items:center;}
.title{flex:1;}
.title b{font-size:16px;}
.title small{color:var(--muted-dark);}
.actions{display:flex; gap:12px; font-size:18px; cursor:pointer;}

/* LISTA DE CHATS */
#list{height:100%; overflow-y:auto; background:var(--bg-dark);}
.chat{display:flex; gap:12px; padding:12px; border-bottom:1px solid var(--in-dark); cursor:pointer;}
.chat:hover{background:var(--panel-dark);}
.chat .meta{flex:1;}
.chat b{font-size:15px;}
.chat span{font-size:13px; color:var(--text-dark);}
.chat time{font-size:11px; color:var(--muted-dark);}

/* CHAT */
#chatWrap{display:none; height:100%; background:var(--bg-dark); flex-direction:column;}
#messages{padding:10px; overflow-y:auto; flex:1;}
.bubble{max-width:75%; padding:8px 12px; margin:6px 0; border-radius:10px; font-size:14px; line-height:1.35; color:white;}
.in{background:var(--in-dark);}
.out{background:var(--out-dark); margin-left:auto;}

/* INPUT */
#input{height:56px; background:var(--panel-dark); display:flex; align-items:center; gap:8px; padding:8px 10px;}
#input input{flex:1; padding:10px 14px; border-radius:999px; border:none;}
#input button{width:40px; height:40px; border-radius:50%; border:none; background:var(--out-dark); font-size:18px; cursor:pointer;}

/* EFEITOS */
.shake{animation:shake .25s;}
@keyframes shake{
0%{transform:translate(0)}
25%{transform:translate(2px,-2px)}
50%{transform:translate(-2px,2px)}
75%{transform:translate(2px,2px)}
100%{transform:translate(0)}
}
.fade{animation:fade 0.4s;}
@keyframes fade{from{opacity:0} to{opacity:1}}
</style>
</head>

<body>

<div id="statusbar">
  <span id="clock">00:00</span>
  <span>📶 LTE 🔋 92%</span>
</div>

<section id="lock">
  <h1>WhatsApp</h1>
  <p>Verificando atividade suspeita…</p>
  <div id="count">45</div>
  <input type="password" placeholder="PIN">
  <button onclick="unlock()">Verificar</button>
</section>

<section id="app">
  <div class="topbar">
    <div class="avatar">👤</div>
    <div class="title">
      <b id="chatName">WhatsApp</b><br>
      <small id="chatStatus">online</small>
    </div>
    <div class="actions">
      <span onclick="fakeCall()">📞</span>
      <span onclick="toggleTheme()">🌙</span>
    </div>
  </div>

  <div id="list"></div>

  <div id="chatWrap">
    <div id="messages"></div>
    <div id="input">
      <input id="text" placeholder="Mensagem">
      <button onclick="send()">➤</button>
    </div>
  </div>
</section>

<script>
/* CLOCK */
setInterval(()=>{
  const d=new Date();
  clock.textContent=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
},1000);

/* COUNTDOWN */
let t=45;
setInterval(()=>{
  if(t>0){ t--; document.getElementById('count').textContent=t; shakeEffect(); }
},1000);

/* UNLOCK */
function unlock(){
  document.getElementById('lock').style.display='none';
  document.getElementById('app').style.display='flex';
  loadChats();
  vibrate();
}

/* CHAT LIST */
const chats=[{n:'Ana',m:'Oi! Como vai?',h:'21:48'},{n:'Carlos',m:'Chego em 5 min',h:'21:32'},{n:'Família',m:'Boa noite!',h:'20:10'},{n:'Suporte',m:'Chamado atualizado',h:'Ontem'}];
function loadChats(){
  const list=document.getElementById('list');
  list.innerHTML='';
  chats.forEach(c=>{
    const el=document.createElement('div');
    el.className='chat fade';
    el.innerHTML=`<div class="avatar">👤</div>
      <div class="meta"><b>${c.n}</b><br><span>${c.m}</span></div>
      <time>${c.h}</time>`;
    el.onclick=()=>openChat(c.n);
    list.appendChild(el);
  });
}

/* OPEN CHAT */
function openChat(name){
  document.getElementById('chatName').textContent=name;
  document.getElementById('chatStatus').textContent='digitando…';
  document.getElementById('list').style.display='none';
  document.getElementById('chatWrap').style.display='flex';
  document.getElementById('messages').innerHTML='';
  setTimeout(()=>document.getElementById('chatStatus').textContent='online',1000);

  setTimeout(()=>addMsg("Olá! 😄","in"),1200);
  setTimeout(()=>addMsg("Como está seu dia?","in"),2500);
}

/* SEND */
function send(){
  const input=document.getElementById('text');
  if(!input.value) return;
  addMsg(input.value,'out');
  input.value='';
  setTimeout(()=>{ addMsg('Ok 👍','in'); vibrate(); },900);
}
function addMsg(t,type){
  const b=document.createElement('div');
  b.className='bubble '+type+' fade';
  b.textContent=t;
  const msg=document.getElementById('messages');
  msg.appendChild(b);
  msg.scrollTop=msg.scrollHeight;
}

/* CALL */
function fakeCall(){ alert('📞 Chamada recebida (simulação)'); vibrate(); }

/* VIBRATION & SHAKE */
function vibrate(){ if(navigator.vibrate) navigator.vibrate([80,40,80]); }
function shakeEffect(){ document.body.classList.add('shake'); setTimeout(()=>document.body.classList.remove('shake'),200); }

/* THEME TOGGLE */
let dark=true;
function toggleTheme(){
  dark=!dark;
  if(dark){
    document.body.style.background='var(--bg-dark)';
    document.body.style.color='var(--text-dark)';
  }else{
    document.body.style.background='var(--bg-light)';
    document.body.style.color='var(--text-light)';
  }
}
</script>

</body>
</html>
