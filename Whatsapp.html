<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>WhatsApp</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="statusbar">
  <span id="clock">00:00</span>
  <span>📶 LTE 🔋 92%</span>
</div>

<!-- LOCK -->
<section id="lock">
  <h1>WhatsApp</h1>
  <p>Detectamos atividade suspeita.<br>Verificando integridade do sistema…</p>
  <div id="count">60</div>
  <input placeholder="Digite o PIN">
  <button id="unlock">Verificar</button>
</section>

<!-- APP -->
<section id="app">
  <header>
    <div class="avatar">👤</div>
    <div>
      <b id="chatName">WhatsApp</b><br>
      <small id="chatStatus">online</small>
    </div>
    <span id="call">📞</span>
  </header>

  <main id="screen"></main>

  <footer id="inputBox">
    <input id="msg" placeholder="Mensagem">
    <button id="send">➤</button>
  </footer>
</section>

<script src="js/app.js"></script>
</body>
</html>
