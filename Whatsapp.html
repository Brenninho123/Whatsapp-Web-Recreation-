<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>WhatsApp Ultra MAX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
:root{
 --bg:#0b141a;--panel:#202c33;--in:#1f2c33;--out:#005c4b;
 --text:#fff;--muted:#8696a0;--seen:#34b7f1;--accent:#25d366;
}
.light{
 --bg:#e9edef;--panel:#f0f2f5;--in:#fff;--out:#dcf8c6;
 --text:#111;--muted:#667781;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui;overflow:hidden}
button,input{border:none;outline:none;background:none;color:var(--text)}
#intro,#verify{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center}
#intro{background:#000}
.logo{width:120px;height:120px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:56px;animation:pulse 1.5s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
#intro p{color:#ccc;margin-top:10px}
#verify{display:none;background:var(--bg)}
.card{width:90%;max-width:360px;background:#111;border-radius:16px;padding:20px}
.pin{display:flex;gap:8px;justify-content:center;margin:12px 0}
.pin input{width:44px;height:52px;border-radius:10px;background:#000;text-align:center;font-size:22px;color:#fff}
.verify-btn{width:100%;padding:12px;border-radius:999px;background:var(--accent);color:#000;font-weight:700}
.loading{text-align:center;color:#aaa}
#app{display:none;height:100%}
.top{height:56px;background:var(--panel);display:flex;align-items:center;padding:0 12px;gap:10px}
.back{display:none;font-size:22px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--out);display:grid;place-items:center}
.title{flex:1}
.title b{font-size:16px}
.title small{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:10px}
#tabs{display:flex;background:#111}
#tabs button{flex:1;padding:10px;color:#ccc;font-weight:600}
#tabs .active{color:#fff;border-bottom:2px solid var(--accent)}
#search{padding:8px;background:var(--panel)}
#search input{width:100%;background:#111;border-radius:999px;padding:10px 14px;color:#fff}
#list,#status,#stories{height:calc(100% - 144px);overflow:auto}
.chat{display:flex;gap:12px;padding:12px;border-bottom:1px solid #1a1a1a;cursor:pointer}
.chat:hover{background:#182229}
.meta b{font-size:15px}
.meta span{font-size:13px;color:var(--muted)}
.story{display:flex;align-items:center;gap:10px;padding:12px}
.story .avatar{border:2px solid var(--accent)}
#chat{display:none;height:calc(100% - 56px);flex-direction:column}
#msgs{flex:1;padding:10px;overflow:auto}
.msg{max-width:78%;padding:8px 12px;margin:6px 0;border-radius:10px;font-size:14px}
.in{background:var(--in)}
.out{background:var(--out);margin-left:auto}
.time{font-size:10px;color:var(--muted);margin-left:6px}
.typing{font-size:12px;color:var(--muted);margin:4px}
.input{background:var(--panel);padding:6px}
.row{display:flex;gap:6px}
.row input{flex:1;background:#111;border-radius:999px;padding:10px 14px;color:#fff}
.row button{width:40px;height:40px;border-radius:50%;background:var(--out);color:#fff}
#notify{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:12px;display:none;z-index:200;font-size:14px}
.swipe-hint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);font-size:12px;color:#888}
</style>
</head>
<body>

<div id="intro" onclick="goVerify()">
 <div class="logo">💬</div>
 <p style="color:#ccc;margin-top:10px">Toque para continuar</p>
</div>

<div id="verify">
 <div class="card">
  <h3>Verificação</h3>
  <p>Digite o código</p>
  <div class="pin">
   <input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1">
  </div>
  <button class="verify-btn" onclick="enterApp()">Verificar</button>
  <div class="loading">Aguarde...</div>
 </div>
</div>

<div id="notify"></div>

<div id="app">
 <div class="top">
  <span class="back" onclick="goBack()">←</span>
  <div class="avatar">👤</div>
  <div class="title">
   <b id="chatName">WhatsApp</b><br>
   <small id="statusTxt">online</small>
  </div>
  <div class="actions">
   <button onclick="toggleTheme()">🌙</button>
  </div>
 </div>

 <div id="tabs">
  <button class="active" onclick="tab(0)">Chats</button>
  <button onclick="tab(1)">Status</button>
  <button onclick="tab(2)">Stories</button>
 </div>

 <div id="search"><input placeholder="Pesquisar"></div>

 <div id="list"></div>
 <div id="status" style="display:none"></div>
 <div id="stories" style="display:none"></div>

 <div id="chat">
  <div id="msgs"></div>
  <div class="typing" id="typing"></div>
  <div class="input">
   <div class="row">
    <input id="text" placeholder="Mensagem">
    <button onclick="send()">➤</button>
   </div>
  </div>
 </div>
</div>

<div class="swipe-hint">Deslize a mensagem →</div>

<script>
const contatos=['Ana','Carlos','Bia','João','Lucas','Marina','Pedro','Sofia'];
const frases=[
 'oii','tô digitando ainda','pera aí','kkkk 😂','já te respondo',
 'mds','faz sentido','entendi 💛','ok','calma','já volto'
];
let current=null;

function hora(){
 const d=new Date();
 return d.getHours().toString().padStart(2,'0')+':'+
        d.getMinutes().toString().padStart(2,'0');
}
function goVerify(){intro.style.display='none';verify.style.display='flex';navigator.vibrate?.(40);}
function enterApp(){verify.style.display='none';app.style.display='block';loadList();showNotify('Conectado');}

function loadList(){
 list.innerHTML='';
 stories.innerHTML='';
 contatos.forEach(n=>{
  list.innerHTML+=`<div class="chat" onclick="openChat('${n}')"><div class="avatar">👤</div><div class="meta"><b>${n}</b><br><span>Mensagem...</span></div></div>`;
  stories.innerHTML+=`<div class="story"><div class="avatar">👤</div><div>${n}</div></div>`;
 });
}

function openChat(n){
 current=n;
 chatName.textContent=n;
 list.style.display='none';
 chat.style.display='flex';
 document.querySelector('.back').style.display='inline';
 msgs.innerHTML='';
 autoReply();
}

function goBack(){chat.style.display='none';list.style.display='block';document.querySelector('.back').style.display='none';}

function addMsg(text,type){
 const d=document.createElement('div');
 d.className='msg '+type;
 d.innerHTML=`${text}<span class="time">${hora()}</span>`;
 msgs.appendChild(d);
 msgs.scrollTop=msgs.scrollHeight;
}

function send(){if(!text.value)return;addMsg(text.value,'out');text.value='';autoReply();}

function autoReply(){
 typing.textContent='digitando...';
 statusTxt.textContent='digitando...';
 setTimeout(()=>{
  typing.textContent='';
  statusTxt.textContent='online';
  addMsg(frases[Math.floor(Math.random()*frases.length)],'in');
  showNotify(`${current} respondeu`);
 },1000+Math.random()*2000);
}

function tab(i){
 list.style.display=i===0?'block':'none';
 status.style.display=i===1?'block':'none';
 stories.style.display=i===2?'block':'none';
}
function toggleTheme(){document.body.classList.toggle('light');}
function showNotify(t){notify.textContent=t;notify.style.display='block';setTimeout(()=>notify.style.display='none',2000);}
</script>
</body>
</html>
