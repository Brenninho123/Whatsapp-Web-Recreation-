<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>WhatsApp</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
/* ================= RESET ================= */
*{margin:0;padding:0;box-sizing:border-box}
html,body{
width:100%;height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
background:#000;color:#e9edef;overflow:hidden
}

/* ================= STATUS BAR ================= */
#statusbar{
height:24px;
background:#0b141a;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 8px;
font-size:12px;
color:#e9edef
}

/* ================= LOCK / VIRUS ================= */
#lock{
position:fixed;inset:0;
background:linear-gradient(180deg,#000,#0b141a);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
z-index:10;
animation:fadeIn .6s
}
#lock h1{color:#25D366;margin-bottom:10px}
#lock p{color:#8696a0;font-size:14px;max-width:280px}
#timer{font-size:28px;color:#ff4d4d;margin:15px}
#lock input{
padding:12px;width:200px;
border-radius:25px;border:none;
text-align:center;font-size:16px
}
#lock button{
margin-top:15px;
padding:12px 30px;
border:none;border-radius:25px;
background:#25D366;color:#000;
font-size:16px
}

/* ================= APP ================= */
#app{display:none;flex-direction:column;height:100%}

/* HEADER */
#header{
background:#202c33;
padding:10px;
display:flex;
align-items:center;
gap:10px
}
#header img{
width:36px;height:36px;border-radius:50%;
background:#25D366
}
#header .info{
flex:1
}
#header .info b{font-size:15px}
#header .info span{
font-size:12px;color:#8696a0
}

/* LIST */
#list{flex:1;overflow-y:auto;background:#0b141a}
.chat{
display:flex;gap:10px;
padding:12px;border-bottom:1px solid #1f2c33
}
.chat:hover{background:#111b21}
.avatar{
width:48px;height:48px;
border-radius:50%;
background:#25D366;
display:flex;align-items:center;justify-content:center;
font-size:22px
}
.chat b{font-size:15px}
.chat span{font-size:13px;color:#8696a0}

/* CHAT */
#chat{display:none;flex-direction:column;flex:1}
#messages{
flex:1;
padding:10px;
background:#0b141a
}
.msg{
max-width:75%;
padding:8px 12px;
margin:6px 0;
border-radius:10px;
font-size:14px
}
.in{background:#1f2c33}
.out{background:#005c4b;margin-left:auto}

/* INPUT */
#input{
display:flex;
padding:10px;
background:#202c33;
gap:8px
}
#input input{
flex:1;
padding:10px;
border-radius:20px;
border:none
}
#input button{
background:#25D366;
border:none;
border-radius:50%;
padding:0 16px;
font-size:18px
}

/* ================= EFFECTS ================= */
.shake{animation:shake .3s}
@keyframes shake{
0%{transform:translate(0)}
25%{transform:translate(4px,-4px)}
50%{transform:translate(-4px,4px)}
75%{transform:translate(4px,4px)}
100%{transform:translate(0)}
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>

<body>

<!-- STATUS BAR -->
<div id="statusbar">
<span id="time">22:41</span>
<span>📶 LTE 🔋 87%</span>
</div>

<!-- LOCK -->
<div id="lock">
<h1>WhatsApp Bloqueado</h1>
<p>Atividade suspeita detectada.<br>Verificando integridade do sistema…</p>
<div id="timer">60</div>
<input placeholder="PIN">
<button onclick="unlock()">Verificar</button>
</div>

<!-- APP -->
<div id="app">
<div id="header">
<img>
<div class="info">
<b id="title">WhatsApp</b><br>
<span id="status">online</span>
</div>
<span onclick="fakeCall()">📞</span>
</div>

<div id="list"></div>

<div id="chat">
<div id="messages"></div>
<div id="input">
<input id="text" placeholder="Mensagem">
<button onclick="send()">➤</button>
</div>
</div>
</div>

<script>
/* ================= CLOCK ================= */
setInterval(()=>{
const d=new Date();
time.innerText=d.getHours().toString().padStart(2,'0')+":"+d.getMinutes().toString().padStart(2,'0');
},1000);

/* ================= TIMER ================= */
let t=60;
setInterval(()=>{
if(t>0){
t--;
timer.innerText=t;
vibrate();
}
},1000);

/* ================= VIBRATION ================= */
function vibrate(){
if(navigator.vibrate) navigator.vibrate(80);
document.body.classList.add("shake");
setTimeout(()=>document.body.classList.remove("shake"),300);
}

/* ================= UNLOCK ================= */
function unlock(){
vibrate();
lock.style.display="none";
app.style.display="flex";
}

/* ================= CHATS ================= */
const users=["Ana","Carlos","Grupo Família","Suporte"];
users.forEach(u=>{
let c=document.createElement("div");
c.className="chat";
c.innerHTML=`
<div class="avatar">👤</div>
<div>
<b>${u}</b><br>
<span>Mensagem recebida</span>
</div>`;
c.onclick=()=>openChat(u);
list.appendChild(c);
});

function openChat(n){
title.innerText=n;
status.innerText="digitando…";
list.style.display="none";
chat.style.display="flex";
messages.innerHTML="";
setTimeout(()=>status.innerText="online",1000);
}

/* ================= MESSAGES ================= */
function send(){
if(!text.value)return;
add(text.value,"out");
text.value="";
setTimeout(()=>{
add("Ok 👍","in");
vibrate();
},900);
}

function add(t,tp){
let m=document.createElement("div");
m.className="msg "+tp;
m.innerText=t;
messages.appendChild(m);
m.scrollIntoView();
}

/* ================= CALL ================= */
function fakeCall(){
alert("📞 Chamada recebida (simulação)");
vibrate();
}

/* fullscreen opcional */
document.documentElement.requestFullscreen?.();
</script>

</body>
</html>
